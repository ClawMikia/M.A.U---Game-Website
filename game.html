<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M.A.U (合気) — Game</title>
<link rel="icon" type="image/png" href="assets/web_icon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ═══ Game HUD ═══ -->
<div id="hud" class="hidden">
  <div class="player-card">
    <img class="player-avatar" id="playerAvatar" src="" alt="">
    <div class="player-meta">
      <div class="player-name" id="playerName">—</div>
      <div class="player-title" id="playerTitle">—</div>
    </div>
    <div class="stat-grid">
      <div class="stat-item"><span class="stat-label">ATK</span><span class="stat-val" id="statAtk">—</span></div>
      <div class="stat-item"><span class="stat-label">SPD</span><span class="stat-val" id="statSpd">—</span></div>
      <div class="stat-item"><span class="stat-label">KB</span><span class="stat-val" id="statKb">—</span></div>
      <div class="stat-item"><span class="stat-label">CRIT</span><span class="stat-val" id="statCrit">—</span></div>
    </div>
    <div class="hp-section">
      <div class="hp-bar-large">
         <div class="hp-fill-large" id="hpFillLarge"></div>
        <div class="hp-text"><span id="hpText">100</span> / <span id="hpMaxText">100</span></div>
      </div>
    </div>
  </div>

  <div class="wave-status">
    <div class="wave-tracker" id="waveTracker"></div>
    <div class="wave-label" id="waveLabel">Wave 1</div>
  </div>

  <div class="hud-resources">
    <div class="enemy-pill" id="hudEnemies">0 remaining</div>
    <div class="inventory-bar" id="inventoryBar">
      <div class="inv-title">Talismans</div>
      <div class="inventory-list" id="inventoryList"></div>
    </div>
  </div>
  <div class="notification-area" id="notificationArea"></div>
</div>
<div id="controls" class="hidden">
  <div class="ctrl-pill">WASD / Arrows — Move</div>
  <div class="ctrl-pill">Mouse — Aim</div>
  <div class="ctrl-pill">Auto-attack on lock</div>
</div>

<!-- ═══ Game Over ═══ -->
<div id="gameover">
  <div class="panel">
    <h2>討死 — Fallen</h2>
    <div class="stat">Waves Survived: <span id="goWave">0</span></div>
    <div class="stat">Enemies Defeated: <span id="goKills">0</span></div>
    <div class="btns">
      <button class="retry" onclick="restartGame()">Retry</button>
      <button class="back" onclick="backToMenu()">Return to Dojo</button>
    </div>
  </div>
</div>

<!-- ═══ Pause Menu ═══ -->
<div id="pauseMenu" class="hidden">
  <div class="panel">
    <h2>Pause</h2>
    <div class="pause-actions">
      <button id="resumeBtn" class="pause-primary">Resume</button>
      <button id="quitBtn" class="pause-secondary">Quit</button>
    </div>
    <div class="volume-panel">
      <label for="volumeSlider">Volume</label>
      <input type="range" id="volumeSlider" min="0" max="100" value="40">
      <button id="muteToggleBtn" class="pause-toggle">Mute</button>
    </div>
  </div>
</div>

<!-- ═══ Game Canvas ═══ -->
<canvas id="gameCanvas" class="game-canvas"></canvas>

<script src="js/game.js"></script>
</body>
</html>
